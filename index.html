<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101827" />
    <meta name="description" content="CodeXa — akun digital yang siap dipakai atau dibuat sesuai namamu." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    />
    <link rel="stylesheet" href="/src/fixes.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="https://codexa-store.vercel.app/" />
    <title>CodeXa Store — Akun digital pilihanmu</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CodeXa Store" />
    <meta property="og:title" content="CodeXa Store — Akun digital pilihanmu" />
    <meta property="og:description" content="Beli akun digital siap pakai atau pesan akun baru sesuai namamu. Proses cepat, saldo aman, dibantu asisten CodeXa." />
    <meta property="og:url" content="https://codexa-store.vercel.app/" />
    <meta property="og:image" content="https://codexa-store.vercel.app/favicon.svg" />
    <meta property="og:locale" content="id_ID" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CodeXa Store — Akun digital pilihanmu" />
    <meta name="twitter:description" content="Beli akun digital siap pakai atau pesan akun baru sesuai namamu. Proses cepat, saldo aman." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Tambahkan shortcut Custom Email ke navigasi store tanpa mengubah state React.
      // MutationObserver menjaga shortcut tetap ada ketika React menggambar ulang topbar.
      (() => {
        const addCustomEmailLink = () => {
          const nav = document.querySelector('.cx-nav');
          if (!nav || nav.querySelector('.cx-custom-email-nav')) return;
          const link = document.createElement('button');
          link.type = 'button';
          link.className = 'cx-custom-email-nav';
          link.textContent = 'Custom Email';
          link.title = 'Cek dan buat request email/username custom';
          link.addEventListener('click', () => { window.location.href = '/custom-email.html'; });
          nav.appendChild(link);
        };
        const observer = new MutationObserver(addCustomEmailLink);
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });
        window.addEventListener('load', addCustomEmailLink);
        setTimeout(addCustomEmailLink, 250);
        setTimeout(addCustomEmailLink, 1000);
      })();
    </script>
  </body>
</html>

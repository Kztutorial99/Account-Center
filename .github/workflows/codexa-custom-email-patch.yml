name: CodeXa Custom Email Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Custom Email 3-per-task + mobile checkout changes
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          main = Path('src/main.jsx')
          orders = Path('api/orders.js')
          styles = Path('src/styles.css')
          s = main.read_text()

          old = '  const [customEmail, setCustomEmail] = useState("");\n  const [emailCheck, setEmailCheck] = useState({ state: "idle", message: "", signals: [] });'
          new = '''  const MAX_CUSTOM_EMAILS = 3;\n  const [customEmails, setCustomEmails] = useState([""]);\n  const [emailChecks, setEmailChecks] = useState([{ state: "idle", message: "", signals: [] }]);'''
          if old not in s: raise SystemExit('main state anchor not found')
          s = s.replace(old, new, 1)

          pattern = r'''  /\* Cek ketersediaan email/username kustom.*?\n  \}, \[customEmail\]\);'''
          replacement = '''  /* Cek semua kandidat custom email dengan satu debounce. Maksimal 3 kandidat. */\n  useEffect(() => {\n    const values = customEmails.map((v) => String(v || "").trim());\n    const next = values.map(() => ({ state: "idle", message: "", signals: [] }));\n    values.forEach((value, i) => {\n      if (!value) return;\n      if (value.length < 3) { next[i] = { state: "invalid", message: "Minimal 3 karakter", signals: [] }; }\n      else next[i] = { state: "checking", message: "Mengecek langsung ke Gmail...", signals: [] };\n    });\n    setEmailChecks(next);\n    const hasChecks = values.some((v) => v.length >= 3);\n    if (!hasChecks) return undefined;\n    const timer = window.setTimeout(() => {\n      Promise.all(values.map((value) => {\n        if (!value || value.length < 3) return Promise.resolve(null);\n        return jsonRequest(`/api/orders?resource=check-email&value=${encodeURIComponent(value)}`)\n          .then((p) => ({\n            state: p.state === "invalid" ? "invalid"\n              : p.state === "unknown" ? "unknown"\n              : p.available ? "available" : "taken",\n            message: p.reason || (p.available ? `${p.normalized} bisa dicoba` : "Sudah dipakai, coba nama lain"),\n            signals: Array.isArray(p.signals) ? p.signals : [],\n          }))\n          .catch((e) => ({ state: "invalid", message: e.message, signals: [] }));\n      })).then((results) => setEmailChecks(results.map((x) => x || ({ state: "idle", message: "", signals: [] }))));\n    }, 1200);\n    return () => window.clearTimeout(timer);\n  }, [customEmails]);'''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('main email-check effect anchor not found')
          s = s2

          checkout_pattern = r'''  const itemsTotal = cart\.reduce\(.*?\n\n\n  /\* ── admin page ── \*/'''
          checkout_repl = '''  const itemsTotal = cart.reduce((a, c) => a + (Number(c.price) || 0), 0);\n  const selectedCustomEmails = customEmails.map((v) => String(v || "").trim()).filter(Boolean).slice(0, MAX_CUSTOM_EMAILS);\n  const customFee = selectedCustomEmails.length * CUSTOM_EMAIL_FEE;\n  const cartTotal = itemsTotal + customFee;\n  const doCheckout = async () => {\n    if (checkout.loading) return;\n    const wantCustom = selectedCustomEmails;\n    const items = cart.map((item) => ({\n      id: item.id,\n      accounts: (item.selectedAccounts || []).map((a) => a.index),\n    })).filter((item) => item.accounts.length);\n    if (!items.length && !wantCustom.length) {\n      setCheckout({ loading: false, error: "Keranjang masih kosong", order: null });\n      return;\n    }\n    if (wantCustom.length > MAX_CUSTOM_EMAILS) {\n      setCheckout({ loading: false, error: `Maksimal ${MAX_CUSTOM_EMAILS} custom email per tugas`, order: null });\n      return;\n    }\n    if (wantCustom.length && emailChecks.slice(0, wantCustom.length).some((c) => !["available", "unknown"].includes(c.state))) {\n      setCheckout({ loading: false, error: "Pastikan semua custom email sudah lolos pengecekan", order: null });\n      return;\n    }\n    setCheckout({ loading: true, error: "", order: null });\n    try {\n      const result = await jsonRequest("/api/orders", {\n        method: "POST",\n        body: JSON.stringify({ items, customEmails: wantCustom }),\n      });\n      setCart([]);\n      setCustomEmails([""]);\n      setEmailChecks([{ state: "idle", message: "", signals: [] }]);\n      setCartOpen(false);\n      setCheckout({ loading: false, error: "", order: result.order });\n      loadSession();\n      loadCatalog();\n      window.dispatchEvent(new Event("codexa:notify"));\n      showNotice(wantCustom.length && !items.length\n        ? `Permintaan ${wantCustom.length} custom email berhasil dibayar`\n        : "Pembayaran berhasil, detail akun sudah terbuka");\n    } catch (error) {\n      setCheckout({ loading: false, error: error.message, order: null });\n    }\n  };\n\n\n  /* ── admin page ── */'''
          s2, n = re.subn(checkout_pattern, checkout_repl, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('main checkout anchor not found')
          s = s2

          # Cart custom email rows.
          cart_old = '''                  {customFee > 0 && (\n                    <div className="cx-cart-item">\n                      <div className="cx-cart-thumb cx-cart-thumb-icon"><Mail size={20} /></div>\n                      <div className="cx-cart-item-copy">\n                        <strong>Custom Email</strong>\n                        <small>{customEmail.trim()} · {formatPrice(CUSTOM_EMAIL_FEE)}</small>\n                      </div>\n                      <button className="cx-icon-btn" onClick={() => setCustomEmail("")}><X size={12} /></button>\n                    </div>\n                  )}'''
          cart_new = '''                  {selectedCustomEmails.map((email, i) => (\n                    <div className="cx-cart-item" key={`custom-${i}`}>\n                      <div className="cx-cart-thumb cx-cart-thumb-icon"><Mail size={20} /></div>\n                      <div className="cx-cart-item-copy">\n                        <strong>Custom Email #{i + 1}</strong>\n                        <small>{email} · {formatPrice(CUSTOM_EMAIL_FEE)}</small>\n                      </div>\n                      <button className="cx-icon-btn" onClick={() => setCustomEmails((list) => list.filter((_, idx) => idx !== i).concat(list.length > 1 ? [] : [""]))}><X size={12} /></button>\n                    </div>\n                  ))}'''
          if cart_old not in s: raise SystemExit('main cart custom anchor not found')
          s = s.replace(cart_old, cart_new, 1)

          summary_old = '''                {customFee > 0 && (\n                  <div><span>Custom email (1x)</span><strong>{formatPrice(customFee)}</strong></div>\n                )}'''
          summary_new = '''                {customFee > 0 && (\n                  <div><span>Custom email ({selectedCustomEmails.length}x)</span><strong>{formatPrice(customFee)}</strong></div>\n                )}'''
          if summary_old not in s: raise SystemExit('main summary anchor not found')
          s = s.replace(summary_old, summary_new, 1)

          custom_block_pattern = r'''                <div className="cx-custom-email">.*?                <p className="cx-checkout-note"'''
          custom_block = '''                <div className="cx-custom-email">\n                  <div className="cx-custom-email-head">\n                    <label><Mail size={11} /> Custom Email</label>\n                    <span>{selectedCustomEmails.length}/{MAX_CUSTOM_EMAILS} · +{formatPrice(CUSTOM_EMAIL_FEE)} / email</span>\n                  </div>\n                  <small className="cx-custom-email-help">Bisa tambahkan maksimal 3 nama dalam satu tugas. Setelah tugas selesai, kamu bisa membuat tugas berikutnya.</small>\n                  <div className="cx-custom-email-list">\n                    {customEmails.map((email, i) => {\n                      const check = emailChecks[i] || { state: "idle", message: "", signals: [] };\n                      return (\n                        <div className="cx-custom-email-row" key={`custom-input-${i}`}>\n                          <div className={`cx-input-wrap cx-custom-email-input is-${check.state}`}>\n                            <span className="cx-custom-email-index">{i + 1}</span>\n                            <input\n                              value={email}\n                              onChange={(e) => setCustomEmails((list) => list.map((v, idx) => idx === i ? e.target.value : v))}\n                              placeholder={i === 0 ? "mis. namaku99 atau namaku99@gmail.com" : "custom email berikutnya"}\n                              maxLength={80}\n                              autoComplete="off"\n                            />\n                            {check.state === "checking" && <Spinner />}\n                            {check.state === "available" && <Check size={12} color="var(--green)" />}\n                            {check.state === "unknown" && <ShieldCheck size={12} color="#eab308" />}\n                            {(check.state === "taken" || check.state === "invalid") && <X size={12} color="var(--red)" />}\n                          </div>\n                          {customEmails.length > 1 && <button type="button" className="cx-icon-btn" onClick={() => { setCustomEmails((list) => list.filter((_, idx) => idx !== i)); setEmailChecks((list) => list.filter((_, idx) => idx !== i)); }} aria-label={`Hapus custom email ${i + 1}`}><X size={12} /></button>}\n                          <small className={`cx-custom-email-msg is-${check.state}`}>{check.message || "Masukkan minimal 3 karakter."}</small>\n                        </div>\n                      );\n                    })}\n                  </div>\n                  {customEmails.length < MAX_CUSTOM_EMAILS && (\n                    <button type="button" className="cx-btn cx-btn-ghost cx-btn-sm cx-custom-email-add" onClick={() => { setCustomEmails((list) => [...list, ""]); setEmailChecks((list) => [...list, { state: "idle", message: "", signals: [] }]); }}>\n                      <Plus size={12} /> Tambah custom email\n                    </button>\n                  )}\n                </div>\n                <p className="cx-checkout-note'''
          s2, n = re.subn(custom_block_pattern, custom_block, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('main checkout custom block anchor not found')
          s = s2

          # Checkout disable logic: no empty/invalid custom email slips through.
          old_disable = 'disabled={checkout.loading || emailCheck.state === "checking" || emailCheck.state === "taken" || emailCheck.state === "invalid"}'
          new_disable = 'disabled={checkout.loading || selectedCustomEmails.some((_, i) => !["available", "unknown"].includes((emailChecks[i] || {}).state))}'
          if old_disable not in s: raise SystemExit('main checkout disable anchor not found')
          s = s.replace(old_disable, new_disable, 1)

          # Custom email page route props.
          old_route = '''      <CustomEmailPage\n        value={customEmail}\n        setValue={setCustomEmail}\n        check={emailCheck}\n        onBack={() => navigate("store")}\n        onUse={() => { showNotice("Custom email masuk keranjang"); navigate("store"); setCartOpen(true); }}\n\n      />'''
          new_route = '''      <CustomEmailPage\n        values={customEmails}\n        setValues={setCustomEmails}\n        checks={emailChecks}\n        onBack={() => navigate("store")}\n        onUse={() => { showNotice(`${customEmails.filter(Boolean).length} custom email masuk keranjang`); navigate("store"); setCartOpen(true); }}\n      />'''
          if old_route not in s: raise SystemExit('main custom route anchor not found')
          s = s.replace(old_route, new_route, 1)

          # Replace the dedicated CustomEmailPage component.
          fn_pattern = r'''function CustomEmailPage\(.*?\n\}\n\n/\* ═══════════════════════════════════════════════════\n   MOBILE TAB BAR'''
          fn_repl = '''function CustomEmailPage({ values, setValues, checks, onBack, onUse }) {\n  const count = values.filter((v) => String(v || "").trim()).length;\n  const ready = count > 0 && values.every((v, i) => !String(v || "").trim() || ["available", "unknown"].includes((checks[i] || {}).state));\n  return (\n    <main className="cx-page cx-custom-page">\n      <div className="cx-container">\n        <button className="cx-back-link" onClick={onBack}>\n          <ArrowRight size={12} style={{ transform: "rotate(180deg)" }} /> Kembali ke Store\n        </button>\n        <div className="cx-custom-shell">\n          <div className="cx-custom-hero">\n            <div className="cx-custom-hero-icon"><Mail size={18} /></div>\n            <div>\n              <span className="cx-custom-kicker">Custom request</span>\n              <h1>Custom Email</h1>\n              <p>Tambahkan sampai 3 nama dalam satu tugas. Semua akan dicek sebelum masuk checkout.</p>\n            </div>\n            <div className="cx-custom-counter"><strong>{count}</strong><span>/ 3</span></div>\n          </div>\n          <div className="cx-custom-card">\n            <div className="cx-custom-card-head">\n              <div><strong>Pilih nama email</strong><small>Biaya {formatPrice(CUSTOM_EMAIL_FEE)} per nama</small></div>\n              <span className="cx-custom-price">{formatPrice(count * CUSTOM_EMAIL_FEE)}</span>\n            </div>\n            <div className="cx-custom-fields">\n              {values.map((value, i) => {\n                const check = checks[i] || { state: "idle", message: "", signals: [] };\n                return (\n                  <div className={`cx-custom-field-row is-${check.state}`} key={i}>\n                    <span className="cx-custom-field-no">{i + 1}</span>\n                    <div className="cx-custom-field-main">\n                      <div className={`cx-input-wrap cx-custom-email-input is-${check.state}`}>\n                        <Mail size={13} />\n                        <input\n                          value={value}\n                          onChange={(e) => setValues((list) => list.map((v, idx) => idx === i ? e.target.value : v))}\n                          placeholder={i === 0 ? "contoh: namaku99 atau namaku99@gmail.com" : "Tambahkan nama email lain"}\n                          maxLength={80}\n                          autoComplete="off"\n                        />\n                        {check.state === "checking" && <Spinner />}\n                        {check.state === "available" && <Check size={13} color="var(--green)" />}\n                        {check.state === "unknown" && <ShieldCheck size={13} color="#eab308" />}\n                        {(check.state === "taken" || check.state === "invalid") && <X size={13} color="var(--red)" />}\n                      </div>\n                      <small className={`cx-custom-email-msg is-${check.state}`}>{check.message || "Masukkan minimal 3 karakter untuk mengecek."}</small>\n                    </div>\n                    {values.length > 1 && <button className="cx-icon-btn" onClick={() => setValues((list) => list.filter((_, idx) => idx !== i))} aria-label={`Hapus email ${i + 1}`}><Trash2 size={12} /></button>}\n                  </div>\n                );\n              })}\n            </div>\n            {values.length < 3 && (\n              <button className="cx-btn cx-btn-ghost cx-custom-add-btn" onClick={() => setValues((list) => [...list, ""])}>\n                <Plus size={13} /> Tambah custom email <span>{values.length}/3</span>\n              </button>\n            )}\n            <div className="cx-custom-info">\n              <ShieldCheck size={14} />\n              <div><strong>Lebih aman dalam satu tugas</strong><span>Setelah tugas ini selesai, kamu baru bisa membuat tugas Custom Email berikutnya.</span></div>\n            </div>\n            <div className="cx-custom-actions">\n              <button className="cx-btn cx-btn-ghost" onClick={onBack}>Batal</button>\n              <button className="cx-btn cx-btn-primary" disabled={!ready} onClick={onUse}>\n                <ShoppingBag size={13} /> Masukkan {count} email ke checkout\n              </button>\n            </div>\n          </div>\n        </div>\n      </div>\n    </main>\n  );\n}\n\n/* ═══════════════════════════════════════════════════\n   MOBILE TAB BAR'''
          s2, n = re.subn(fn_pattern, fn_repl, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('main CustomEmailPage function anchor not found')
          s = s2

          main.write_text(s)

          # Backend: accept up to 3 custom emails and block a second active task.
          b = orders.read_text()
          anchor = '''const CUSTOM_EMAIL_FEE = 5000;\n\nconst MAX_ITEMS = 50;'''
          repl = '''const CUSTOM_EMAIL_FEE = 5000;\nconst MAX_CUSTOM_EMAILS = 3;\n\nconst MAX_ITEMS = 50;'''
          if anchor not in b: raise SystemExit('orders constants anchor not found')
          b = b.replace(anchor, repl, 1)

          post_pattern = r'''    const payload = bodyOf\(request\) \|\| \{\};\n    const items = normalizeItems\(payload\);\n\n    const customCheck = normalizeCustomEmail\(payload\.customEmail\);.*?\n    if \(customEmail\) \{\n      const inspection = await inspectCustomEmail\(sql, customCheck\);\n      if \(!inspection\.available\) return response\.status\(409\)\.json\(\{ error: inspection\.reason \}\);\n    \n'''
          post_repl = '''    const payload = bodyOf(request) || {};\n    const items = normalizeItems(payload);\n    const rawCustomEmails = Array.isArray(payload.customEmails)\n      ? payload.customEmails\n      : payload.customEmail ? [payload.customEmail] : [];\n    const customEmails = [];\n    for (const raw of rawCustomEmails) {\n      const check = normalizeCustomEmail(raw);\n      if (!check.ok) return response.status(400).json({ error: check.error });\n      if (check.value && !customEmails.some((x) => x.value === check.value)) customEmails.push(check);\n    }\n    if (customEmails.length > MAX_CUSTOM_EMAILS) {\n      return response.status(400).json({ error: `Maksimal ${MAX_CUSTOM_EMAILS} custom email dalam satu tugas` });\n    }\n\n    if (!items.length && !customEmails.length) {\n      return response.status(400).json({ error: "Keranjang kosong atau belum ada akun yang dipilih" });\n    }\n\n    if (customEmails.length) {\n      await ensureCustomEmailTable(sql);\n      const [active] = await sql`\n        SELECT order_id AS "orderId" FROM codexa_custom_emails\n        WHERE user_id = ${user.id} AND status IN ('pending', 'processing')\n        ORDER BY created_at DESC LIMIT 1\n      `;\n      if (active) {\n        return response.status(409).json({ error: "Custom email masih diproses. Tunggu sampai tugas sebelumnya selesai sebelum membeli lagi." });\n      }\n      for (const customCheck of customEmails) {\n        const inspection = await inspectCustomEmail(sql, customCheck);\n        if (!inspection.available) return response.status(409).json({ error: inspection.reason });\n      }\n    }\n'''
          b2, n = re.subn(post_pattern, post_repl, b, count=1, flags=re.S)
          if n != 1: raise SystemExit('orders POST custom block anchor not found')
          b = b2

          b = b.replace('    if (customEmail) total += CUSTOM_EMAIL_FEE;', '    if (customEmails.length) total += customEmails.length * CUSTOM_EMAIL_FEE;', 1)

          insert_pattern = r'''    if \(customEmail\) \{\n      try \{\n        await sql`\n          INSERT INTO codexa_custom_emails \(id, user_id, order_id, requested, status\)\n          VALUES \(\$\{crypto\.randomUUID\(\)\}, \$\{user\.id\}, \$\{order\.id\}, \$\{customEmail\}, 'pending'\)\n          ON CONFLICT DO NOTHING\n        `;\n      \} catch \(error\) \{\n        console\.error\("Custom email reserve failure", error && error\.message\);\n      \}\n    \}'''
          insert_repl = '''    if (customEmails.length) {\n      try {\n        for (const customCheck of customEmails) {\n          await sql`\n            INSERT INTO codexa_custom_emails (id, user_id, order_id, requested, status)\n            VALUES (${crypto.randomUUID()}, ${user.id}, ${order.id}, ${customCheck.value}, 'pending')\n            ON CONFLICT DO NOTHING\n          `;\n        }\n      } catch (error) {\n        console.error("Custom email reserve failure", error && error.message);\n      }\n    }'''
          b2, n = re.subn(insert_pattern, insert_repl, b, count=1, flags=re.S)
          if n != 1: raise SystemExit('orders insert custom block anchor not found')
          b = b2

          # Group multiple custom-email rows by order for both admin and user order responses.
          b = b.replace('customByOrder = new Map(custom.map((c) => [c.orderId, c]));', 'customByOrder = new Map();\n      for (const c of custom) { const list = customByOrder.get(c.orderId) || []; list.push(c); customByOrder.set(c.orderId, list); }', 1)
          b = b.replace('mine = new Map(custom.map((c) => [c.orderId, c]));', 'mine = new Map();\n        for (const c of custom) { const list = mine.get(c.orderId) || []; list.push(c); mine.set(c.orderId, list); }', 1)

          # Backward-compatible order response fields + new array fields.
          b = b.replace('customEmail: (custom && custom.requested) || "",\n        customEmailStatus: (custom && custom.status) || "",', 'customEmails: Array.isArray(custom) ? custom.map((c) => ({ requested: c.requested, status: c.status })) : [],\n        customEmail: Array.isArray(custom) && custom[0] ? custom[0].requested : "",\n        customEmailStatus: Array.isArray(custom) && custom[0] ? custom[0].status : "",', 2)
          b = b.replace('body: itemCount\n        ? `${itemCount} akun senilai Rp${total.toLocaleString("id-ID")} sudah dibayar. Detail login bisa dilihat di halaman Pesanan.`\n        : `Permintaan custom email ${customEmail} senilai Rp${total.toLocaleString("id-ID")} sudah dibayar dan sedang diproses admin.`,', 'body: itemCount\n        ? `${itemCount} akun senilai Rp${total.toLocaleString("id-ID")} sudah dibayar. Detail login bisa dilihat di halaman Pesanan.`\n        : `Permintaan ${customEmails.length} custom email senilai Rp${total.toLocaleString("id-ID")} sudah dibayar dan sedang diproses admin.`,', 1)
          b = b.replace('customEmailStatus: customEmail ? "pending" : "",', 'customEmails: customEmails.map((c) => ({ requested: c.value, status: "pending" })),\n        customEmail: customEmails[0] ? customEmails[0].value : "",\n        customEmailStatus: customEmails.length ? "pending" : "",', 1)
          orders.write_text(b)

          css = styles.read_text()
          marker = '/* CodeXa: custom email 3-per-task + mobile checkout polish */'
          if marker not in css:
            css += '''\n\n/* CodeXa: custom email 3-per-task + mobile checkout polish */\n.cx-custom-shell{max-width:760px;margin:18px auto 70px}.cx-custom-hero{display:flex;align-items:center;gap:14px;padding:18px;border:1px solid var(--b1);background:var(--panel);border-radius:14px;margin-bottom:12px}.cx-custom-hero-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:11px;background:var(--bg2);color:var(--ink2);flex:0 0 auto}.cx-custom-kicker{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);margin-bottom:3px}.cx-custom-hero h1{font-size:22px;margin:0 0 4px;letter-spacing:-.03em}.cx-custom-hero p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.cx-custom-counter{margin-left:auto;min-width:58px;text-align:center;border:1px solid var(--b1);border-radius:10px;padding:8px 7px}.cx-custom-counter strong{font-size:18px}.cx-custom-counter span{font-size:11px;color:var(--faint)}.cx-custom-card{border:1px solid var(--b1);background:var(--panel);border-radius:14px;padding:16px}.cx-custom-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.cx-custom-card-head strong,.cx-custom-card-head small{display:block}.cx-custom-card-head strong{font-size:13px}.cx-custom-card-head small{color:var(--muted);font-size:11px;margin-top:3px}.cx-custom-price{font-weight:700;font-size:13px}.cx-custom-fields{display:grid;gap:10px}.cx-custom-field-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:9px;align-items:start}.cx-custom-field-no{width:28px;height:34px;display:grid;place-items:center;border:1px solid var(--b1);border-radius:8px;color:var(--faint);font-size:11px}.cx-custom-field-main{min-width:0}.cx-custom-field-main .cx-input-wrap{min-height:36px}.cx-custom-field-row>.cx-icon-btn{margin-top:4px}.cx-custom-add-btn{margin-top:12px;width:100%;justify-content:center}.cx-custom-add-btn span{margin-left:auto;color:var(--faint)}.cx-custom-info{display:flex;gap:9px;align-items:flex-start;padding:11px 12px;margin-top:14px;border:1px solid var(--b1);border-radius:10px;background:var(--bg2);color:var(--muted);font-size:11px}.cx-custom-info svg{flex:0 0 auto;color:var(--green)}.cx-custom-info strong,.cx-custom-info span{display:block}.cx-custom-info strong{color:var(--ink2);margin-bottom:2px}.cx-custom-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.cx-custom-email-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}.cx-custom-email-head label{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600}.cx-custom-email-head>span{font-size:10px;color:var(--faint)}.cx-custom-email-help{display:block;color:var(--muted);font-size:10px;margin-bottom:9px}.cx-custom-email-list{display:grid;gap:8px}.cx-custom-email-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px;align-items:start}.cx-custom-email-row .cx-custom-email-msg{grid-column:1 / -1;margin-left:4px}.cx-custom-email-row .cx-input-wrap{min-height:34px}.cx-custom-email-index{display:inline-grid;place-items:center;width:18px;height:18px;border:1px solid var(--b1);border-radius:5px;font-size:9px;color:var(--faint);flex:0 0 auto}.cx-custom-email-input{gap:7px}.cx-custom-email-input input{min-width:0}.cx-checkout-note{font-size:10px;line-height:1.4}.cx-cart-summary{padding:14px 14px calc(14px + env(safe-area-inset-bottom))}.cx-cart-drawer{max-height:min(760px,100dvh);display:flex;flex-direction:column}.cx-cart-summary .cx-custom-email{padding:10px;border:1px solid var(--b1);border-radius:10px;margin:8px 0}.cx-cart-summary .cx-custom-email-add{min-height:34px}.cx-cart-summary .cx-custom-email-row{min-width:0}.cx-cart-summary .cx-custom-email-row .cx-input-wrap{width:100%}\n@media (max-width:640px){.cx-custom-shell{margin-top:10px}.cx-custom-hero{padding:14px;border-radius:12px;align-items:flex-start}.cx-custom-hero-icon{width:36px;height:36px}.cx-custom-hero h1{font-size:19px}.cx-custom-hero p{font-size:11px}.cx-custom-counter{min-width:48px;padding:6px}.cx-custom-card{padding:12px;border-radius:12px}.cx-custom-card-head{align-items:flex-start}.cx-custom-actions{position:sticky;bottom:0;margin-left:-12px;margin-right:-12px;margin-bottom:-12px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--b1);z-index:3}.cx-custom-actions .cx-btn{flex:1;min-width:0}.cx-custom-actions .cx-btn-primary{white-space:nowrap}.cx-cart-drawer{width:100%;max-width:100vw;border-radius:16px 16px 0 0}.cx-drawer-header{padding:12px 14px}.cx-cart-summary{font-size:11px}.cx-cart-summary .cx-btn-full{min-height:42px}.cx-custom-email-head{align-items:flex-start}.cx-custom-email-head>span{white-space:nowrap}.cx-custom-email-row{grid-template-columns:minmax(0,1fr) auto}.cx-custom-email-input input{font-size:16px}.cx-custom-email-msg{font-size:10px}.cx-buy-modal{width:calc(100vw - 20px);max-height:calc(100dvh - 20px);overflow:auto}.cx-modal-backdrop{padding:10px}.cx-buy-body{padding:14px}}\n'''
            styles.write_text(css)

          print('Patch applied')
          PY

      - name: Validate
        run: |
          node --check api/orders.js
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit patched files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/codexa-custom-email-patch.yml
          git add src/main.jsx src/styles.css api/orders.js .github/workflows/codexa-custom-email-patch.yml
          git commit -m "feat: custom email up to 3 per task and mobile checkout" || exit 0
          git push
